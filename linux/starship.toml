# --- PC Stats
[custom.cpu]
command = '''
lscpu | awk -F: '/Model name/ {gsub(/^ +/, "", $2); print $2}' \
| grep -oE '(i[3579]-[A-Za-z0-9]+|Ryzen [0-9]+ [0-9A-Za-z]+)' \
| head -n1
'''
when = "true"
format = " $output"

[custom.cpu_utilization]
command = "top -bn1 | grep 'Cpu(s)' | sed 's/.*, \\([0-9.]*\\)%* id.*/\\1/' | awk '{print 100 - $1\"%\"}'"
when = "true"
format = "$output"

[custom.memory]
command = """
used=$(free -m | awk '/^Mem:/ {print $3}')
total=$(free -m | awk '/^Mem:/ {print $2}')

if [ $total -lt 1024 ]; then
  echo "$used/$total MiB"
else
  printf "%.2f/%.1f GiB\n" "$(echo "$used/1024" | bc -l)" "$(echo "$total/1024" | bc -l)"
fi
"""
when = true
format = "🧠 $output"

[localip]
ssh_only = false
format = '$localipv4'
disabled = false
