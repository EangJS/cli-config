format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_commit\
$all\
$fill\
[](blue)\
[ ${custom.cpu} ${custom.cpu_utilization} ](bg:blue fg:#bac2de)\
[ ${custom.memory} ](bg:cyan fg:#bac2de)\
[ ${localip} ](bg:green fg:#bac2de)\
[](green)\
$line_break\
[╰─](bold green_bright)\
$character\
$time\
$cmd_duration\
$sudo\
$status
"""

[fill]
symbol = ' '

[sudo]
style = "bold green"
symbol = "👩 "
disabled = false

[directory]
read_only = " 󰌾"
style = "fg:blue"
read_only_style = "fg:bright-red"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style) "

[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 20
style = "bold red"
discharging_symbol = "⚡"
charging_symbol = "🔌"

[[battery.display]]
threshold = 99
style = "yellow"
discharging_symbol = "⚡"
charging_symbol = "🔌"

[[battery.display]]
threshold = 100
discharging_symbol = "🔋"
charging_symbol = "🔋"

[time]
time_format = "%T"
format = "🕙 $time($style) "
style = "bright-white"
disabled = false

[cmd_duration]
disabled = false
min_time = 2000
format = "[$duration]($style) "
style = "bold fg:yellow"

[aws]
disabled = true
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "
format = "[$name $version]($style)"

[cmake]
symbol = " "

[conda]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "

[git_branch]
